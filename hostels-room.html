<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hostels</title>
    <link href="./src/output.css" rel="stylesheet">
</head>
<body class="bg-black text-white">
  <!-- ================= NAVBAR ================= -->
  <nav class="bg-[#1a1a1a] border-b border-gray-800 px-6 py-3 flex items-center justify-between">

    <!-- Left Logo -->
    <div class="flex items-center gap-2">
      <span class="w-3 h-3 bg-cyan-400 rounded-full"></span>
      <span class="text-white font-semibold tracking-wide">HMS</span>
    </div>

    <!-- Center Navigation -->
    <div class="hidden md:flex items-center gap-6 text-sm">

      <!-- Active Tab -->
      <a href="#"
        class="relative px-5 py-2 flex gap-2 text-lg text-cyan-400 font-medium rounded-t-lg border border-cyan-400 bg-black/40">
        <img src="./image/material-symbols_dashboard-outline.png" alt="">
        <p>Dashboard</p>
      </a>

      <a href="#" class="text-gray-400 flex gap-2 text-lg hover:text-white transition">
        <img src="./image/fluent_device-meeting-room-20-regular.png" alt="">
        <p>Rooms</p>
      </a>

      <a href="#" class="text-gray-400 flex gap-2 text-lg hover:text-white transition">
        <img src="./image/material-symbols_co-present-outline-sharp.png" alt="">
        <p>Attendance</p>
      </a>

      <a href="#" class="text-gray-400 flex gap-2 text-lg hover:text-white transition">
        <img src="./image/material-symbols_account-balance-outline-rounded.png" alt="">
        <p>Account</p>
      </a>

      <a href="#" class="text-gray-400 flex gap-2 text-lg hover:text-white transition">
        <img src="./image/material-symbols_account-balance-outline-rounded (1).png" alt="">
        <p>Maintenance</p>
      </a>
    </div>

    <!-- Right Icons -->
    <div class="flex items-center gap-4">

      <!-- Calendar -->
      <div
        class="w-9 h-9 bg-gray-800 rounded-full flex items-center justify-center cursor-pointer hover:bg-gray-700 transition">
        <img src="./image/calendar.png" alt="">
      </div>

      <!-- Notification -->
      <div
        class="w-9 h-9 bg-gray-800 rounded-full flex items-center justify-center cursor-pointer hover:bg-gray-700 transition relative">
        <img src="./image/notification.png" alt="">
        <span class="absolute top-1 right-1 w-2 h-2 bg-yellow-400 rounded-full"></span>
      </div>

      <!-- User -->
      <div class="w-9 h-9 bg-cyan-500/20 rounded-full flex items-center justify-center cursor-pointer">
        👤
      </div>

    </div>
  </nav>
 <div class="flex min-h-screen">
    <!-- ================= LEFT SIDEBAR ================= -->
    <aside class="w-60 bg-[#111111] rounded-xl m-5 p-4">

      <div class="flex flex-col gap-2 text-sm font-medium">

        <!-- Active Item -->
        <a href="#"
          class="flex items-center gap-2 px-4 py-3 rounded-lg bg-white/5 text-white">
          <img src="./image/uis_analytics.png" alt="Analytics Icon" class="w-5 h-5">
          <span>Occupancy</span>
        </a>

        <!-- Item -->
        <a href="#"
          class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-400 hover:bg-white/5 hover:text-white transition">
          <img src="./image/fluent_building-multiple-20-regular.png" alt="Hostels Icon" class="w-5 h-5">
          <span>Hostels</span>
        </a>

        <!-- Item -->
        <a href="#"
          class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-400 hover:bg-white/5 hover:text-white transition">
          <img src="./image/fluent_door-arrow-right-20-regular.png" alt="Rooms Icon" class="w-5 h-5">
          <span>Rooms</span>
        </a>

        <!-- Item -->
        <a href="#"
          class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-400 hover:bg-white/5 hover:text-white transition">
          <img src="./image/material-symbols_assignment-outline.png" alt="Assigned Icon" class="w-5 h-5">
          <span>Assigned</span>
        </a>

        <!-- Item -->
        <a href="#"
          class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-400 hover:bg-white/5 hover:text-white transition">
          <img src="./image/material-symbols_chair-outline.png" alt="Furniture Icon" class="w-5 h-5">
          <span>Furniture</span>
        </a>
      </div>
    </aside>
    
<main class="bg-black p-6 text-white">
<div class="max-w-7xl mx-auto">

</div>
</main>
    
</body>
</html>
